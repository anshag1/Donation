services:
  postgres:
    image: postgres:16-alpine
    container_name: donation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: donation
      POSTGRES_PASSWORD: donation
      POSTGRES_DB: donation_dev
    ports:
      # Host port 5435 — 5432/5433/5434 are already used by other local
      # projects on this machine (see `docker ps`); the container's internal
      # port stays 5432 either way.
      - "5435:5432"
    volumes:
      - donation_pg_data:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donation -d donation_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional — only needed to exercise the durable RQ task queue locally
  # (see app/worker/rq_queue.py). Local-first mode (the default) doesn't use
  # this: receipt generation runs in-process via FastAPI BackgroundTasks
  # unless REDIS_URL is set in backend/.env. Start with:
  #   docker compose --profile durable-queue up -d
  redis:
    image: redis:7-alpine
    container_name: donation_redis
    restart: unless-stopped
    profiles: ["durable-queue"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donation_pg_data:
